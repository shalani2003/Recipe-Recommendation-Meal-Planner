<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - VitaPlate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/theme.css"></head>
<body data-page="profile.html" data-title="Profile">
<div class="main"><main class="content">
<section class="hero"><div><h1>Your profile</h1><p>Set your name, daily calorie goal and diet. Everything stays in your browser.</p></div><div class="cast" id="cast"></div></section>
<section class="card" style="max-width:560px"><label class="field">Name<input class="input" id="n"></label><label class="field" style="margin-top:12px">Daily calorie goal (kcal)<input class="input" id="k" type="number" min="1000" max="4000"></label><p class="muted" style="margin:14px 0 8px">Dietary restrictions</p><div class="diet" id="dt" style="display:flex;gap:8px;flex-wrap:wrap"></div><div class="row" style="margin-top:18px"><button class="btn btn-primary" id="sv">Save profile</button><button class="btn btn-ghost" id="rs">Reset all data</button></div><p id="ok" class="muted" role="status"></p></section>
</main></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
const $=id=>document.getElementById(id);
$("cast").innerHTML=["tomato","egg","carrot"].map(k=>char(k,84)).join("");

const D=["Vegetarian","Vegan","Gluten-free","Dairy-free","Nut-free","Halal","Low sugar"];let dt=_l("vp_diets",[]);
$("n").value=VP.user.name;$("k").value=VP.user.goalKcal;
const dd=()=>$("dt").innerHTML=D.map(x=>`<button class="tab" data-d="${x}" aria-pressed="${dt.includes(x)}">${x}</button>`).join("");dd();
$("dt").onclick=e=>{const x=e.target.dataset.d;if(!x)return;dt=dt.includes(x)?dt.filter(y=>y!=x):[...dt,x];dd()};
$("sv").onclick=()=>{_s("vp_user",{name:$("n").value||"Friend",goalKcal:+$("k").value||1800});_s("vp_diets",dt);$("ok").textContent="Saved ✓"};
$("rs").onclick=()=>{if(confirm("Delete all VitaPlate data in this browser?")){localStorage.clear();location.reload()}};
</script></body></html>
