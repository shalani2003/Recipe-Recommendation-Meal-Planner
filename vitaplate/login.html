<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log in - VitaPlate</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth auth-slideshow-page">
    <aside class="auth-art">
        <div class="auth-slideshow" aria-label="Healthy meal planning photos">
            <img src="assets/1.jpg" alt="Meal planner inspiration" class="active">
            <img src="assets/2.jpg" alt="Healthy prepared meals">
            <img src="assets/3.jpg" alt="Family preparing a meal">
        </div>
    </aside>

    <main class="auth-form">
        <img class="auth-logo" src="assets/logo.jpeg" alt="VitaPlate logo">
        <div class="auth-intro">
            <h1>Welcome back</h1>
            <p>Log in to see your pantry, recipes and weekly meal plan.</p>
        </div>
        <div class="auth-card">
            <h2 style="font-size:1.7rem">Log in</h2>
            <p class="sub">Good to see you again.</p>
            
            <!-- Error Alert Box -->
            <div class="alert" id="alert" role="alert" aria-live="assertive"></div>

            <form id="loginForm" novalidate style="display:flex;flex-direction:column;gap:14px">
                <label class="field">Email
                    <input class="input" id="email" type="email" autocomplete="email" aria-describedby="emailErr">
                    <div class="err" id="emailErr" aria-live="polite"></div>
                </label>
                
                <label class="field">Password
                    <div class="pw">
                        <input class="input" id="pw" type="password" autocomplete="current-password" aria-describedby="pwErr">
                        <!-- Show/Hide Button -->
                        <button type="button" data-pw="pw" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                    <div class="err" id="pwErr" aria-live="polite"></div>
                </label>
                
                <button class="btn btn-primary" type="submit">Log in</button>
            </form>
            <p class="switch"><a href="reset-password.html">Forgot your password?</a></p>
            <p class="switch">New to VitaPlate? <a href="register.html">Create an account</a></p>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
