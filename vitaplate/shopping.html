<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping list - VitaPlate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/theme.css"></head>
<body data-page="shopping.html" data-title="Shopping list">
<div class="main"><main class="content">
<section class="hero"><div><h1>Shopping list</h1><p>Build a list from your meal plan. Only what is missing from your pantry is added.</p><button class="btn btn-lime" id="build">Build from meal plan</button></div><div class="cast" id="cast"></div></section>
<div class="card" style="margin-bottom:20px"><div class="row"><input class="input" id="nm" placeholder="Add an item" style="flex:1;min-width:180px"><button class="btn btn-primary" id="add">Add</button><button class="btn btn-ghost" id="mv">Move bought to pantry</button></div></div><div id="list"></div>
</main></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
const $=id=>document.getElementById(id);
$("cast").innerHTML=["tomato","avocado","egg"].map(k=>char(k,84)).join("");

let S=_l("vp_shop",[]);const save=()=>_s("vp_shop",S);
function draw(){$("list").innerHTML=S.length?S.map(i=>`<div class="todo ${i.done?"done":""}"><input type="checkbox" data-c="${i.id}" ${i.done?"checked":""} aria-label="Bought ${i.name}"><b>${i.name}</b><button class="btn btn-ghost btn-sm" data-x="${i.id}">Remove</button></div>`).join(""):`<div class="card" style="text-align:center">${char("tomato",90)}<h3>Your list is empty</h3><p class="muted">Press Build from meal plan.</p></div>`;save()}
const add=n=>{n=n.trim();if(n&&!S.some(x=>x.name.toLowerCase()==n.toLowerCase()))S.push({id:Math.random(),name:n,done:false})};
$("add").onclick=()=>{add($("nm").value);$("nm").value="";draw()};
$("build").onclick=()=>{const p=_l("vp_plan",{});Object.values(p).forEach(d=>Object.values(d).forEach(id=>{const r=R.find(x=>x.id==id);r&&r.ing.filter(i=>!haveIng(i)).forEach(add)}));draw()};
$("mv").onclick=()=>{const P=_l("vp_pantry",[]);S.filter(i=>i.done).forEach(i=>P.push({id:Math.random(),name:i.name,cat:"Other",qty:1,unit:"pcs",exp:""}));_s("vp_pantry",P);S=S.filter(i=>!i.done);draw()};
document.addEventListener("click",e=>{const d=e.target.dataset;if(d.x){S=S.filter(i=>i.id!=d.x);draw()}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.c){S.find(i=>i.id==d.c).done=e.target.checked;draw()}});draw();
</script></body></html>
