								}

		<div class="main">
			<main class="content">

				<!-- Clean Hero Section (No Button) -->
				<section class="hero hero-premium">
					<div>
						<h1>Your Shopping List</h1>
						<p>Easily manage what you need to buy. Add items manually or type to get smart suggestions from our grocery list.</p>
					</div>
				</section>

				<!-- Action Bar -->
				<form class="action-bar" id="manualShopForm" novalidate>
					<datalist id="grocery-suggestions"></datalist>
					<input id="nm" list="grocery-suggestions" placeholder="Item name" aria-label="Item name" autocomplete="off">
					<input id="shopQuantity" class="quantity-input" type="number" inputmode="decimal" step="any" placeholder="Qty" aria-label="Quantity">
					<select id="shopUnit" class="unit-select" aria-label="Unit">
						<option value="pcs">pcs</option>
						<option value="g">g</option>
						<option value="kg">kg</option>
						<option value="ml">ml</option>
						<option value="l">l</option>
						<option value="cups">cups</option>
					</select>
					<input id="pantryExpiry" class="expiry-input" type="date" aria-label="Pantry expiry date (optional)" title="Expiry date for Pantry items (optional)">

						<button class="btn-premium btn-add" id="add" type="submit">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
								<line x1="12" y1="5" x2="12" y2="19"></line>
								<line x1="5" y1="12" x2="19" y2="12"></line>
							</svg>
							Add
						</button>
						<button class="btn-premium btn-move" id="mv" type="button">

								<line x1="12" y1="22.08" x2="12" y2="12"></line>
							</svg>
							To Pantry
						</button>
						<button class="btn-premium btn-move" id="build" type="button">Build from meal plan</button>
						<button class="btn-premium btn-clear" id="clr" type="button" title="Clear List">🗑️</button>
				</form>
				<p id="shopStatus" class="muted" role="status" aria-live="polite"></p>

				<div id="list" class="shop-grid"></div>

			</main>
		</div>

			document.addEventListener('DOMContentLoaded', () => {
			const $ = id => document.getElementById(id);

			// 1. Setup State
			const SHOP_INITIALIZED_KEY = "vp_shop_initialized";
			const sampleShoppingItems = [
				{name: "Rice", done: false},
				{name: "Onion", done: false},
				{name: "Coconut", done: false}
			];
			let S = [];
			const save = async () => {
				const response = await fetch("/api/shopping", {
					method: "PUT",
					credentials: "same-origin",
					headers: {"Content-Type": "application/json"},
					body: JSON.stringify({items: S})
				});
				const result = await response.json().catch(() => ({}));
				if (response.status === 401) {
					location.replace("login.html");
					throw new Error("Please sign in again.");
				}
				if (!response.ok) throw new Error(result.error || "Could not save your shopping list.");
				S = result.items || [];
				return S;
			};
			const readApi = async path => {
				const response = await fetch(path, {credentials: "same-origin"});
				const result = await response.json().catch(() => ({}));
				if (response.status === 401) {
					location.replace("login.html");
					throw new Error("Please sign in again.");
				}
				if (!response.ok) throw new Error(result.error || "Could not load your saved data.");
				return result;
			};
			const snapshot = () => S.map(item => ({...item}));
			const saveAndDraw = async previous => {
				try {
					await save();
					draw();
					return true;
				} catch (error) {
					if (previous) S = previous;
					draw();
					status(error.message || "Could not save your shopping list.");
					return false;
				}
			};
			const mealPlanSignature = plan => Object.keys(plan || {}).sort().reduce((selection, day) => {
				const meals = plan[day] || {};
				Object.keys(meals).sort().forEach(meal => {
					const id = meals[meal];
					if (id !== "" && id !== null && id !== undefined && id !== 0) {
						selection.push(`${day}:${meal}:${id}`);
					}
				});
				return selection;
			}, []).join("|");
			const dismissedForPlan = plan => {
				const signature = mealPlanSignature(plan);
				const dismissed = _l("vp_shop_dismissed_plan", {signature: "", keys: []});
				if (dismissed.signature !== signature) {
					const next = {signature, keys: []};
					_s("vp_shop_dismissed_plan", next);
					return next;
				}
				return dismissed;
			};

				function getCategory(name) {
				const n = name.toLowerCase();
				if (/chicken|beef|pork|meat|fish|salmon|tuna|egg|prawn|maldive|dhal|green gram|chickpeas|cowpea/.test(n)) return "Protein";
				if (/milk|cheese|yogurt|dairy|butter|cream|curd/.test(n)) return "Dairy";
				if (/tomato|avocado|onion|garlic|ginger|vegetable|broccoli|carrot|potato|salad|spinach|apple|banana|fruit|coconut|pumpkin|brinjal|gourd|okra|beans|cabbage|gotukola|mukunuwenna|papaya|mango|pineapple|lime/.test(n)) return "Produce";
				if (/rice|bread|flour|grain|quinoa|pasta|nut|seed|oats|kurakkan|sugar|salt/.test(n)) return "Pantry";
				if (/chili|turmeric|curry|pepper|cinnamon|cardamom|cloves|oil|sauce|tea|coffee/.test(n)) return "Spices & Oils";
				return "Other";
				}

				// 5. Image Resolver with Bulletproof Fallback
				function getImage(name) {
				const n = name.toLowerCase().trim();
				// If exact match exists
				if (IMAGE_MAP[n]) return IMAGE_MAP[n];

				// Fallback matching logic based on keywords
				if (/chicken|beef|pork|meat/.test(n)) return IMAGE_MAP["chicken"];
				if (/fish|prawn|seafood/.test(n)) return IMAGE_MAP["fish"];
				if (/rice|grain|quinoa/.test(n)) return IMAGE_MAP["samba rice"];
				if (/dhal|lentil|gram|bean/.test(n)) return IMAGE_MAP["red dhal"];
				if (/milk|dairy/.test(n)) return IMAGE_MAP["milk"];
				if (/tomato|vegetable|broccoli|carrot|potato|greens/.test(n)) return IMAGE_MAP["tomato"];
				if (/onion|garlic|ginger/.test(n)) return IMAGE_MAP["onion"];
				if (/oil|sauce|spice|powder|pepper/.test(n)) return IMAGE_MAP["coconut oil"];

				// Absolute final fallback: A generic grocery basket image
				return "https://images.unsplash.com/photo-1542838132-92c53300491e?w=150&h=150&fit=crop";
				}

				const status = message => $("shopStatus").textContent = message;

				// 6. Render Function
				function draw() {
				const listEl = $("list");

				if (!S.length) {
				listEl.innerHTML = `
				<div class="empty-state">
					<img src="https://cdn-icons-png.flaticon.com/512/11329/11329060.png" alt="Empty cart">
						<h3 style="color: #1d4638; font-size: 1.4rem;">Your list is empty</h3>
						<p class="muted" style="margin-top: 8px;">Use the search box above to add items.</p>
					</div>`;
				return;
				}

				const sorted = [...S].sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1));

				listEl.innerHTML = sorted.map(item => `
				<div class="shop-card ${item.done ? 'done' : ''}">

					<button type="button" class="custom-check" data-check="${item.id}" aria-label="Toggle ${item.name}">
						<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="20 6 9 17 4 12"></polyline>
						</svg>
					</button>

					<div class="item-image">
						<!-- Double-layered Fallback (If Image fails, it loads a safe grocery image) -->
						<img src="${getImage(item.name)}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=150&h=150&fit=crop';">
        </div>

					<div class="item-details">
						<span class="item-name">${item.name}</span>
						${VPShopping.formatQuantity(item) ? `<span class="item-quantity">${VPShopping.formatQuantity(item)}</span>` : ""}
						<span class="item-badge">${getCategory(item.name)}</span>
					</div>

					<button type="button" class="delete-btn" data-delete="${item.id}" aria-label="Remove ${item.name}">
						<svg viewBox="0 0 24 24" width="20" height="20" stroke-linecap="round" stroke-linejoin="round">
							<line x1="18" y1="6" x2="6" y2="18"></line>
							<line x1="6" y1="6" x2="18" y2="18"></line>
						</svg>
					</button>

				</div>
				`).join('');
				}

				const addManualItem = async event => {
					event.preventDefault();
					const input = $("nm");
					const previous = snapshot();
					const result = VPShopping.addManualShoppingItem(
						S,
						input.value,
						$("shopQuantity").value,
						$("shopUnit").value
					);
					if (result.error) {
						status(result.error);
						input.focus();
						return;
					}

					if (!await saveAndDraw(previous)) return;
					$("manualShopForm").reset();
					status(result.merged
						? `${result.item.name} quantity updated on your list.`
						: `${result.item.name} added to your list.`);
				};

				const syncMealPlanShoppingList = async (announce = false) => {
					try {
						await VP.ready;
						const [planResult, recipeResult] = await Promise.all([
							readApi("/api/meal-plan"),
							readApi("/api/recipes")
						]);
						const apiRecipes = Array.isArray(recipeResult)
							? recipeResult : recipeResult.recipes || [];
						const catalog = apiRecipes.map(recipe => ({
							...recipe,
							id: `api:${recipe.id}`,
							ing: recipe.ingredients || [],
							kcal: recipe.kcal || 0,
							p: recipe.protein || 0,
							c: recipe.carbs || 0,
							f: recipe.fat || 0,
							time: recipe.time_min || 0
						}));
						const plan = {};
						(planResult.meals || []).forEach(entry => {
							const recipe = [...R, ...catalog].find(item =>
								item.name.toLowerCase() === entry.recipe_name.toLowerCase()
							);
							if (!recipe) return;
							plan[entry.day] = plan[entry.day] || {};
							plan[entry.day][entry.meal] = recipe.id;
						});
						const hasPlannedMeals = Object.keys(plan).length > 0;
						const nextItems = VPShopping.buildFromMealPlan(
							plan, catalog, S, VP.pantry, dismissedForPlan(plan).keys
						);
						const additions = nextItems.filter(generated =>
							!S.some(existing =>
								VPShopping.ingredientKey(existing.name, existing.unit) ===
								VPShopping.ingredientKey(generated.name, generated.unit)
							)
						);
						if (additions.length) {
							const previous = snapshot();
							S = S.concat(additions);
							if (!await saveAndDraw(previous)) return 0;
						}
						if (announce) {
							status(additions.length
								? `${additions.length} missing ingredient${additions.length === 1 ? "" : "s"} added.`
								: hasPlannedMeals
									? "Your shopping list is already up to date."
									: "Add meals to your meal plan before building a shopping list.");
						}
						return additions.length;
					} catch (error) {
						status(`Unable to update the shopping list: ${error.message}`);
					}
				};

				const buildFromMealPlan = async () => {
					await syncMealPlanShoppingList(true);
				};

				// 7. Event Listeners
				$("manualShopForm").addEventListener("submit", addManualItem);
				$("build").addEventListener("click", buildFromMealPlan);
				// Move to Pantry
				$("mv").addEventListener("click", async () => {
				const boughtItems = S.filter(i => i.done);

				if (boughtItems.length === 0) {
				status("Mark items as bought before moving them to the Pantry.");
				return;
				}

				const previous = snapshot();
				const movedIds = [];
				for (const item of boughtItems) {
					try {
						const response = await fetch("/api/pantry", {
							method: "POST",
							credentials: "same-origin",
							headers: {"Content-Type": "application/json"},
							body: JSON.stringify({
								name: item.name,
								category: item.category || "Other",
								quantity: item.quantity || item.qty || 1,
								unit: item.unit || "pcs",
								expiry_date: $("pantryExpiry").value || null
							})
						});
						const result = await response.json().catch(() => ({}));
						if (response.status === 401) {
							location.replace("login.html");
							return;
						}
						if (!response.ok) throw new Error(result.error || `Could not move ${item.name}.`);
						movedIds.push(String(item.id));
					} catch (error) {
						status(error.message || "Could not save Pantry updates.");
						break;
					}
				}
				if (!movedIds.length) return;
				S = S.filter(item => !movedIds.includes(String(item.id)));
				if (await saveAndDraw(previous)) {
					status(`${movedIds.length} bought item${movedIds.length === 1 ? "" : "s"} moved to the Pantry.`);
				}
				});

				// Clear List
				$("clr").addEventListener("click", async () => {
				if (confirm("Clear entire shopping list?")) {
				const previous = snapshot();
				S = [];
				if (await saveAndDraw(previous)) status("Shopping list cleared.");
				}
				});

				// Event Delegation for Cards
				$("list").addEventListener("click", async (e) => {
				const checkBtn = e.target.closest('[data-check]');
				if (checkBtn) {
				const previous = snapshot();
				const itemId = checkBtn.getAttribute('data-check');
				const item = VPShopping.toggleBoughtItem(S, itemId);
				if (item) {
					if (!await saveAndDraw(previous)) return;
					status(`${item.name} ${item.done ? "marked as bought" : "marked as not bought"}.`);
				}
				return;
				}

				const deleteBtn = e.target.closest('[data-delete]');
				if (deleteBtn) {
				const previous = snapshot();
				const itemId = deleteBtn.getAttribute('data-delete');
				const removed = VPShopping.removeShoppingItem(S, itemId);
				if (!removed) return;
				if (removed.source === "meal-plan") {
					const plan = _l("vp_plan", {});
					const dismissed = dismissedForPlan(plan);
					const key = VPShopping.ingredientKey(removed.name, removed.unit);
					if (dismissed.keys.indexOf(key) === -1) dismissed.keys.push(key);
					_s("vp_shop_dismissed_plan", dismissed);
				}
				if (await saveAndDraw(previous)) status(`${removed.name} removed from your list.`);
				}
				});

				// Initial render
				readApi("/api/shopping").then(async result => {
					S = VPShopping.deduplicateShoppingItems(result.items || []);
					const firstVisit = localStorage.getItem(SHOP_INITIALIZED_KEY) !== "true";
					if (!S.length && firstVisit) {
						S = sampleShoppingItems.map(item => ({...item}));
						if (await saveAndDraw([])) localStorage.setItem(SHOP_INITIALIZED_KEY, "true");
						return;
					}
					draw();
					if (firstVisit) localStorage.setItem(SHOP_INITIALIZED_KEY, "true");
				}).catch(error => {
					status(error.message || "Could not load your shopping list.");
				});
				});
			</script>
	</body>
</html>
