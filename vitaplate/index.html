<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - VitaPlate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"></head>
<body data-page="index.html" data-title="Today">
<div class="main"><main class="content">
  <div class="page-head"><h1 id="hello"></h1><p>Here is your plate for today.</p></div>
  <div class="grid g-3">
    <section class="card"><div class="card-head"><h2>Calories</h2></div>
      <div class="ring" id="ring"><svg viewBox="0 0 180 180" width="180" height="180"><circle class="track" cx="90" cy="90" r="76"/><circle class="fill" cx="90" cy="90" r="76"/></svg>
      <div class="ring-label"><b id="eaten"></b><span class="muted" id="left"></span></div></div></section>
    <section class="card"><div class="card-head"><h2>Macros</h2></div><div id="macros"></div></section>
    <section class="card"><div class="card-head"><h2>Water</h2><span class="muted" id="waterCount"></span></div><div class="cups" id="cups"></div></section>
  </div>
  <div class="grid g-2" style="margin-top:20px">
    <section class="card"><div class="card-head"><h2>Today's meals</h2><a class="btn btn-ghost btn-sm" href="planner.html">Open planner</a></div><div id="meals"></div></section>
    <section class="card"><div class="card-head"><h2>Cook with your pantry</h2><a class="btn btn-primary btn-sm" href="recipes.html">See all</a></div><div id="picks"></div></section>
  </div>
</main></div>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
const u=VP.user, eaten=VP.today.reduce((s,m)=>s+m.kcal,0);
document.getElementById("hello").textContent="Hello, "+u.name;
document.getElementById("eaten").textContent=eaten;
document.getElementById("left").textContent=(u.goalKcal-eaten)+" kcal left";
setRing(document.getElementById("ring"),eaten,u.goalKcal);
const col={protein:"var(--olive)",carbs:"var(--sage)",fat:"var(--slate)"};
document.getElementById("macros").innerHTML=Object.entries(u.macros).map(([k,[a,b]])=>
 `<div class="stat-row"><div><span style="text-transform:capitalize">${k}</span><span class="muted">${a} / ${b} g</span></div><div class="bar"><i style="--v:${a/b*100}%;--c:${col[k]}"></i></div></div>`).join("");
document.getElementById("meals").innerHTML=VP.today.map(m=>
 `<div class="list-item"><div class="thumb">${m.emoji}</div><div class="grow"><b>${m.name}</b><div class="muted">${m.meal}</div></div><span>${m.kcal} kcal</span></div>`).join("");
document.getElementById("picks").innerHTML=VP.picks.map(r=>
 `<div class="list-item"><div class="thumb">${r.emoji}</div><div class="grow"><b>${r.name}</b><div class="muted">${r.kcal} kcal</div></div><span class="chip">${r.match}% match</span></div>`).join("");
let water=3;const cups=document.getElementById("cups");
function drawCups(){cups.innerHTML=Array.from({length:8},(_,i)=>`<button class="cup" aria-pressed="${i<water}" aria-label="Cup ${i+1}" data-i="${i}">💧</button>`).join("");
 document.getElementById("waterCount").textContent=water+" of 8 cups"}
cups.onclick=e=>{const b=e.target.closest(".cup");if(!b)return;const i=+b.dataset.i;water=(water===i+1)?i:i+1;drawCups()};
drawCups();
</script></body></html>
