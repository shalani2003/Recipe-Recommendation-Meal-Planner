<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health & BMI - VitaPlate</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body[data-page="health.html"] .content {
            width: 100%;
            margin: 0 auto;
        }

        .hero {
            background: #e8f3df;
            color: #1f5a29;
            isolation: isolate;
            overflow: hidden;
        }

        .hero h1 {
            color: #1f5a29;
            position: relative;
            z-index: 2;
        }

        .hero p {
            color: #426c4a;
            position: relative;
            z-index: 2;
        }

        .hero-photo {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 68%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
        }

        .hero::before {
            content: none;
        }

        .hero > div {
            position: relative;
            z-index: 2;
            max-width: 48%;
            padding: 12px;
            border-radius: 12px;
            background: #e8f3df;
        }

        @media (max-width: 820px) {
            .hero-photo {
                top: 42%;
                width: 100%;
                height: 58%;
                -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
                mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
            }

            .hero > div {
                max-width: 100%;
            }
        }
    </style>
</head>

<body data-page="health.html" data-title="Health & BMI">
    <div class="main">
        <main class="content">

            <!-- Hero Section -->
            <section class="hero">
                <div>
                    <h1>Let's check your health</h1>
                    <p>Check your BMI and see how far you are from your target weight.</p>
                </div>
                <img class="hero-photo" src="assets/top.jpg" alt="Healthy lifestyle">
            </section>

            <!-- BMI Calculator Form Section -->
            <section class="card" style="max-width: 560px; margin: 0 auto;">
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <label class="field">
                        Height (cm)
                        <input class="input" id="h" type="number" min="100" max="230" step="any" aria-describedby="heightError">
                        <p class="profile-error" id="heightError" role="alert"></p>
                    </label>

                    <label class="field">
                        Weight (kg)
                        <input class="input" id="w" type="number" min="25" max="250" step="any" aria-describedby="weightError">
                        <p class="profile-error" id="weightError" role="alert"></p>
                    </label>

                    <label class="field" style="grid-column: 1 / -1;">
                        Target weight (kg)
                        <input class="input" id="t" type="number" min="25" max="250" step="any" aria-describedby="targetError">
                                <p class="profile-error" id="targetError" role="alert"></p>
                    </label>
                </div>

                <button class="btn btn-primary" id="go" style="margin-top: 14px;">Calculate</button>

                <!-- BMI Result Output Container -->
                <div id="out" style="margin-top: 18px;"></div>
            </section>

            <section class="card" style="max-width:560px;margin:20px auto 0" aria-labelledby="waterTitle">
                <h2 id="waterTitle">Water tracker</h2>
                <p class="muted">Today's glasses are saved to your account.</p>
                <div class="row" style="align-items:center;gap:12px;margin-top:12px">
                    <button class="btn btn-ghost" id="waterDown" type="button" aria-label="Remove one glass">−</button>
                    <strong id="waterCount" aria-live="polite">0 glasses today</strong>
                    <button class="btn btn-primary" id="waterUp" type="button">Add a glass</button>
                </div>
                <p id="waterStatus" class="muted" role="status"></p>
            </section>

            <section class="card" style="max-width:560px;margin:20px auto 0" aria-labelledby="weightHistoryTitle">
                <div class="row" style="justify-content:space-between;align-items:center;gap:12px">
                    <div>
                        <h2 id="weightHistoryTitle">Weight history</h2>
                        <p class="muted">Changes saved from this page are recorded here.</p>
                    </div>
                    <button class="btn btn-ghost" id="logWeight" type="button">Log current weight</button>
                </div>
                <p id="weightLogStatus" class="muted" role="status"></p>
                <ul id="weightHistory" class="muted" aria-live="polite"></ul>
            </section>

        </main>
    </div>

    <!-- External Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Application Script -->
    <script>
        // DOM Helper
        const $ = id => document.getElementById(id);
        const requestJson = async (path, method = "GET", payload) => {
            const response = await fetch(path, {
                method,
                credentials: "same-origin",
                headers: payload === undefined ? {} : {"Content-Type": "application/json"},
                body: payload === undefined ? undefined : JSON.stringify(payload)
            });
            const data = await response.json().catch(() => ({}));
            if (response.status === 401) {
                location.replace("login.html");
                throw new Error("Please sign in again.");
            }
            if (!response.ok) throw new Error(data.error || "Could not save your health data.");
            return data;
        };
        let waterGlasses = 0;
        const now = new Date();
        const today = [
            now.getFullYear(),
            String(now.getMonth() + 1).padStart(2, "0"),
            String(now.getDate()).padStart(2, "0")
        ].join("-");
        const renderWater = () => {
            $("waterCount").textContent = `${waterGlasses} glass${waterGlasses === 1 ? "" : "es"} today`;
            $("waterDown").disabled = waterGlasses <= 0;
            $("waterUp").disabled = waterGlasses >= 30;
        };
        const renderWeightHistory = entries => {
            $("weightHistory").replaceChildren(...entries.map(entry => {
                const item = document.createElement("li");
                item.textContent = `${entry.logged_on}: ${entry.weight_kg} kg`;
                return item;
            }));
            if (!entries.length) $("weightHistory").textContent = "No weight entries yet.";
        };
        async function loadTracking() {
            try {
                const [water, history] = await Promise.all([
                    requestJson(`/api/water?day=${today}`),
                    requestJson("/api/weight-log")
                ]);
                waterGlasses = water.glasses;
                renderWater();
                renderWeightHistory(history.entries || []);
            } catch (error) {
                $("waterStatus").textContent = error.message;
                $("weightLogStatus").textContent = error.message;
            }
        }
        async function changeWater(delta) {
            const next = Math.max(0, Math.min(30, waterGlasses + delta));
            try {
                const saved = await requestJson("/api/water", "PUT", {day: today, glasses: next});
                waterGlasses = saved.glasses;
                renderWater();
                $("waterStatus").textContent = "Water tracker saved.";
            } catch (error) {
                $("waterStatus").textContent = error.message;
            }
        }

        const numberInRange = (value, limits) => Number.isFinite(value) && value >= limits.min && value <= limits.max;

        // Calculate BMI and keep the optional target from affecting invalid results.
        async function calc() {
            const heightText = $("h").value.trim();
            const weightText = $("w").value.trim();
            const targetText = $("t").value.trim();
            const heightCm = Number(heightText);
            const weightKg = Number(weightText);
            const targetKg = targetText ? Number(targetText) : null;

            $("heightError").textContent = !heightText
                ? "Height is required."
                : !numberInRange(heightCm, HEALTH_LIMITS.height)
                  ? "Height must be between 100 and 230 cm."
                  : "";
            $("weightError").textContent = !weightText
                ? "Weight is required."
                : !numberInRange(weightKg, HEALTH_LIMITS.weight)
                  ? "Weight must be between 25 and 250 kg."
                  : "";
            $("targetError").textContent = "";

            if ($("heightError").textContent || $("weightError").textContent) {
                $("out").innerHTML = "";
                return;
            }

            if (targetText && (!numberInRange(targetKg, HEALTH_LIMITS.weight))) {
                $("targetError").textContent = "Target weight must be between 25 and 250 kg.";
                $("out").innerHTML = "";
                return;
            }

            const heightM = heightCm / 100;
            const b = weightKg / (heightM * heightM);
            const roundedBmi = Number(b.toFixed(1));
            if (targetKg !== null) {
                const targetBmi = targetKg / (heightM * heightM);
                if (!numberInRange(targetBmi, HEALTH_LIMITS.bmi)) {
                    const safeMin = (HEALTH_LIMITS.bmi.min * heightM * heightM).toFixed(1);
                    const safeMax = (HEALTH_LIMITS.bmi.max * heightM * heightM).toFixed(1);
                    $("targetError").textContent = `Choose a safe target between ${safeMin} and ${safeMax} kg (BMI ${HEALTH_LIMITS.bmi.min}–${HEALTH_LIMITS.bmi.max}).`;
                    $("out").innerHTML = "";
                    return;
                }
            }

            let response, result;
            try {
                response = await fetch("/api/profile", {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({height: heightCm, weight: weightKg, target_weight: targetKg})
                });
                result = await response.json().catch(() => ({}));
            } catch {
                $("out").textContent = "Cannot reach the server. Your health details were not saved.";
                return;
            }
            if (response.status === 401) {
                location.replace("login.html");
                return;
            }
            if (!response.ok) {
                $("out").textContent = result.error || "Your health details could not be saved.";
                return;
            }
            VP.profile = result;

            const c = roundedBmi < 18.5 ? "Underweight" : roundedBmi < 25 ? "Healthy" : roundedBmi < 30 ? "Overweight" : "Obese";
            const pos = Math.min(Math.max((b - 12) / (40 - 12), 0), 1) * 100;
            let journey = "";
            if (targetKg !== null) {
                const difference = weightKg - targetKg;
                if (difference > 0) {
                    journey = `${difference.toFixed(1)} kg to lose to reach your target.`;
                } else if (difference === 0) {
                    journey = "You are at your target weight.";
                } else {
                    journey = `${Math.abs(difference).toFixed(1)} kg to gain · This is not a weight-loss journey.`;
                }
            }

            // Render Output
            $("out").innerHTML = `
                <h2>BMI ${roundedBmi.toFixed(1)} <span class="chip">${c}</span></h2>
                <div class="bmi-scale">
                    <i style="left: ${pos}%"></i>
                </div>
                <div class="muted" style="font-size: .8rem; display: flex; justify-content: space-between;">
                    <span>Under</span>
                    <span>Healthy</span>
                    <span>Over</span>
                    <span>Obese</span>
                </div>
                ${journey ? `<p style="margin-top: 12px;">${journey}</p>` : ""}
            `;
        }

        $("go").onclick = calc;
        $("waterDown").onclick = () => changeWater(-1);
        $("waterUp").onclick = () => changeWater(1);
        $("logWeight").onclick = async () => {
            const weight = Number($("w").value);
            if (!numberInRange(weight, HEALTH_LIMITS.weight)) {
                $("weightLogStatus").textContent = "Enter a weight between 25 and 250 kg first.";
                return;
            }
            try {
                const result = await requestJson("/api/weight-log", "POST", {
                    weight_kg: weight,
                    logged_on: today
                });
                const history = await requestJson("/api/weight-log");
                renderWeightHistory(history.entries || []);
                $("weightLogStatus").textContent = `Logged ${result.entry.weight_kg} kg.`;
            } catch (error) {
                $("weightLogStatus").textContent = error.message;
            }
        };
        VP.ready.then(() => {
            if (VP.apiError) {
                $("out").textContent = VP.apiError;
                return;
            }
            loadTracking();
            $("h").value = VP.profile.height ?? "";
            $("w").value = VP.profile.weight ?? "";
            $("t").value = VP.profile.target_weight ?? "";
            if ($("h").value && $("w").value) calc();
        });
    </script>
</body>
</html>
