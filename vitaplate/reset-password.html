<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset password - VitaPlate</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
    <aside class="auth-art">
        <div class="slideshow-container" aria-label="Healthy meal planning photos">
            <img src="images/img1.jpeg" class="slide active" alt="Healthy lifestyle">
            <img src="images/img2.jpeg" class="slide" alt="Cooking together">
            <img src="images/img3.jpeg" class="slide" alt="Meal planning">
        </div>
        <div class="auth-content">
            <img src="assets/logo.jpeg" alt="VitaPlate logo" class="logo">
            <h1>Fresh start</h1>
            <p>Choose a new password and get back to planning meals you love.</p>
        </div>
    </aside>

    <main class="auth-form">
        <div class="auth-card">
            <h2 style="font-size:1.7rem">Reset password</h2>
            <p class="sub">Enter your account email and choose a new password.</p>

            <div class="alert" id="alert" role="alert" aria-live="assertive"></div>

            <form id="resetForm" novalidate style="display:flex;flex-direction:column;gap:14px">
                <label class="field">Email
                    <input class="input" id="email" type="email" autocomplete="email" aria-describedby="emailErr">
                    <div class="err" id="emailErr" aria-live="polite"></div>
                </label>

                <label class="field">New password
                    <div class="pw">
                        <input class="input" id="pw" type="password" autocomplete="new-password" aria-describedby="pwErr">
                        <button type="button" data-pw="pw" aria-label="Show new password" aria-pressed="false">Show</button>
                    </div>
                    <div class="err" id="pwErr" aria-live="polite"></div>
                </label>

                <label class="field">Confirm new password
                    <div class="pw">
                        <input class="input" id="pw2" type="password" autocomplete="new-password" aria-describedby="pw2Err">
                        <button type="button" data-pw="pw2" aria-label="Show confirm password" aria-pressed="false">Show</button>
                    </div>
                    <div class="err" id="pw2Err" aria-live="polite"></div>
                </label>

                <button class="btn btn-primary" type="submit">Save new password</button>
            </form>
            <p class="switch"><a href="login.html">Back to log in</a></p>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const slides = document.querySelectorAll(".slide");
            let currentSlide = 0;
            if (slides.length > 1) {
                setInterval(() => {
                    slides[currentSlide].classList.remove("active");
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add("active");
                }, 3000);
            }
        });
    </script>
</body>
</html>
