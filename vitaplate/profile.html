
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Profile - VitaPlate</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .profile-hero {
            background: #e8f3df;
            color: #1f5a29;
            isolation: isolate;
            overflow: hidden;
        }

        .profile-hero h1 {
            color: #1f5a29;
            position: relative;
            z-index: 2;
        }

        .profile-hero p {
            color: #426c4a;
            position: relative;
            z-index: 2;
        }

        .profile-hero .hero-photo {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 78%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
        }

        .profile-hero > div:first-child {
            position: relative;
            z-index: 2;
            max-width: 48%;
            padding: 12px;
            border-radius: 12px;
            background: #e8f3df;
        }

        @media (max-width: 820px) {
            .profile-hero .hero-photo {
                top: 42%;
                width: 100%;
                height: 58%;
                -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
                mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
            }

            .profile-hero > div:first-child {
                max-width: 100%;
            }
        }
    </style>
</head>

<body data-page="profile.html" data-title="Profile">

    <!-- Main page content -->
    <div class="main">
        <main class="content">

            <!-- Section 1: Profile heading -->
            <section class="hero profile-hero">
                <div>
                    <h1>Your profile</h1>
                    <p>Set your name, daily calorie goal and diet. Everything stays in your browser.</p>
                </div>

                <img class="hero-photo" src="assets/profile.jpg" alt="Profile">
            </section>

            <!-- Section 2: Profile settings form -->
            <section class="card" style="max-width:560px;margin:0 auto">

                <!-- User name -->
                <label class="field">
                    Name
                    <input class="input" id="n">
                </label>

                <label class="field" style="margin-top:12px">
                    Age
                    <input class="input" id="age" type="number" min="1" max="120" placeholder="Age in years">
                </label>

                <!-- Daily calorie goal -->
                <label class="field" style="margin-top:12px">
                    Daily calorie goal (kcal)
                    <input class="input" id="k"
                           type="number" min="1000" max="4000">
                </label>

                <div class="grid g-2" style="margin-top:12px">
                    <label class="field">Height (cm)
                        <input class="input" id="profileHeight" type="number" min="100" max="230" placeholder="e.g. 165">
                    </label>
                    <label class="field">Current weight (kg)
                        <input class="input" id="profileWeight" type="number" min="25" max="250" placeholder="e.g. 60">
                    </label>
                </div>

                <label class="field" style="margin-top:12px">Allergies (comma-separated)
                    <input class="input" id="allergies" placeholder="e.g. peanuts, eggs">
                </label>
                <label class="field" style="margin-top:12px">Infections / health notes
                    <input class="input" id="infections" placeholder="Enter any relevant notes, or leave blank">
                </label>

                <!-- Dietary restrictions -->
                <p class="muted" style="margin:14px 0 8px">
                    Dietary restrictions
                </p>

                <div class="diet" id="dt"
                     style="display:flex;gap:8px;flex-wrap:wrap">
                </div>

                <!-- Save and reset buttons -->
                <div class="row" style="margin-top:18px">
                    <button class="btn btn-primary" id="sv">
                        Save profile
                    </button>

                    <button class="btn btn-ghost" id="rs">
                        Reset all data
                    </button>
                </div>

                <!-- Save confirmation message -->
                <p id="ok" class="muted" role="status"></p>

            </section>

        </main>
    </div>

    <!-- JavaScript files -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Profile page JavaScript -->
    <script>
        const $ = id => document.getElementById(id);

        const D = [
            "Vegetarian",
            "Vegan",
            "Gluten-free",
            "Dairy-free",
            "Nut-free",
            "Halal",
            "Low sugar"
        ];

        let dt = _l("vp_diets", []);
        const savedProfile = _l("vp_profile", {});
        const savedHealth = _l("vp_health", {});

        $("n").value = VP.user.name;
        $("k").value = VP.user.goalKcal;
        $("age").value = savedProfile.age || "";
        $("allergies").value = savedProfile.allergies || "";
        $("infections").value = savedProfile.infections || "";
        $("profileHeight").value = savedHealth.h || "";
        $("profileWeight").value = savedHealth.w || "";

        const dd = () => $("dt").innerHTML = D.map(x =>
            `<button class="tab" data-d="${x}"
            aria-pressed="${dt.includes(x)}">${x}</button>`
        ).join("");

        dd();

        $("dt").onclick = e => {
            const x = e.target.dataset.d;
            if (!x) return;

            dt = dt.includes(x)
                ? dt.filter(y => y != x)
                : [...dt, x];

            dd();
        };

        $("sv").onclick = () => {
            const age = +$("age").value || "";
            const height = +$("profileHeight").value || 0;
            const weight = +$("profileWeight").value || 0;
            if (age && (age < 1 || age > 120)) {
                $("ok").textContent = "Enter an age between 1 and 120.";
                return;
            }
            if (height && (height < 100 || height > 230)) {
                $("ok").textContent = "Enter a height between 100 and 230 cm.";
                return;
            }
            if (weight && (weight < 25 || weight > 250)) {
                $("ok").textContent = "Enter a weight between 25 and 250 kg.";
                return;
            }

            _s("vp_user", {
                ...VP.user,
                name: $("n").value.trim() || "Friend",
                goalKcal: +$("k").value || 1800
            });
            _s("vp_profile", {
                age,
                allergies: $("allergies").value.trim(),
                infections: $("infections").value.trim()
            });
            if (height || weight) {
                _s("vp_health", { ...savedHealth, h: height || savedHealth.h || "", w: weight || savedHealth.w || "", t: savedHealth.t || "" });
            }
            _s("vp_diets", dt);
            $("ok").textContent = "Profile saved ✓";
        };

        $("rs").onclick = () => {
            if (confirm("Delete VitaPlate data saved in this browser? Other websites' data will not be changed.")) {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith("vp_")) keysToRemove.push(key);
                }
                keysToRemove.forEach(key => localStorage.removeItem(key));
                location.reload();
            }
        };
    </script>

</body>
</html>
