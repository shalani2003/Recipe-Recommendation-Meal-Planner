
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Profile - VitaPlate</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .profile-hero {
            background: #e8f3df;
            color: #1f5a29;
            isolation: isolate;
            overflow: hidden;
        }

        .profile-hero h1 {
            color: #1f5a29;
            position: relative;
            z-index: 2;
        }

        .profile-hero p {
            color: #426c4a;
            position: relative;
            z-index: 2;
        }

        .profile-hero .hero-photo {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 78%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
        }

        .profile-hero > div:first-child {
            position: relative;
            z-index: 2;
            max-width: 48%;
            padding: 12px;
            border-radius: 12px;
            background: #e8f3df;
        }

        .profile-error {
            min-height: 1.2em;
            margin: 4px 0 0;
            color: var(--danger);
            font-size: .82rem;
        }

        .preference-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .preference-options label {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            background: #fff;
            cursor: pointer;
        }

        .preference-options input {
            width: 17px;
            height: 17px;
            accent-color: var(--olive);
        }

        .preference-group { margin-top: 20px; }
        .preference-group h2 { font-size: 1.05rem; }
        .preference-group .input { margin-top: 7px; }

        @media (max-width: 820px) {
            .profile-hero .hero-photo {
                top: 42%;
                width: 100%;
                height: 58%;
                -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
                mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
            }

            .profile-hero > div:first-child {
                max-width: 100%;
            }
        }
    </style>
</head>

<body data-page="profile.html" data-title="Profile">

    <!-- Main page content -->
    <div class="main">
        <main class="content">

            <!-- Section 1: Profile heading -->
            <section class="hero profile-hero">
                <div>
                    <h1>Your profile</h1>
                    <p>Update your profile and dietary preferences saved to your account.</p>
                </div>

                <img class="hero-photo" src="assets/profile.jpg" alt="Profile">
            </section>

            <!-- Section 2: Profile settings form -->
            <section class="card" style="max-width:560px;margin:0 auto">

                <!-- User name -->
                <label class="field">
                    Name
                    <input class="input" id="n" aria-describedby="nameError">
                    <p class="profile-error" id="nameError" role="alert"></p>
                </label>

                <label class="field" style="margin-top:12px">
                    Age
                    <input class="input" id="age" type="number" min="1" max="120" step="1" placeholder="Age in years" aria-describedby="ageError">
                    <p class="profile-error" id="ageError" role="alert"></p>
                </label>

                <label class="field" style="margin-top:12px">
                    Daily calorie goal (between 1,000 and 4,000 kilocalories per day)
                    <input class="input" id="k"
                              type="number" min="1000" max="4000" step="1" aria-describedby="calorieError"
                              aria-label="Daily calorie goal in kilocalories per day">
                          <p class="profile-error" id="calorieError" role="alert"></p>
                </label>

                <div class="grid g-2" style="margin-top:12px">
                    <label class="field">Height (cm)
                        <input class="input" id="profileHeight" type="number" min="100" max="230" step="any" placeholder="e.g. 165" aria-describedby="heightError">
                        <p class="profile-error" id="heightError" role="alert"></p>
                    </label>
                    <label class="field">Current weight (kg)
                        <input class="input" id="profileWeight" type="number" min="25" max="250" step="any" placeholder="e.g. 60" aria-describedby="weightError">
                        <p class="profile-error" id="weightError" role="alert"></p>
                    </label>
                </div>

                <div class="preference-group">
                    <h2>Dietary preferences</h2>
                    <div class="preference-options">
                        <label><input type="checkbox" name="dietPreference" value="Vegetarian"> Vegetarian</label>
                        <label><input type="checkbox" name="dietPreference" value="Vegan"> Vegan</label>
                        <label><input type="checkbox" name="dietPreference" value="Gluten-free"> Gluten-free</label>
                        <label><input type="checkbox" name="dietPreference" value="Dairy-free"> Dairy-free</label>
                        <label><input type="checkbox" name="dietPreference" value="Nut-free"> Nut-free</label>
                        <label><input type="checkbox" name="dietPreference" value="Halal"> Halal</label>
                        <label><input type="checkbox" name="dietPreference" value="Low sugar"> Low sugar</label>
                    </div>
                </div>

                <div class="preference-group">
                    <h2>Food allergies</h2>
                    <div class="preference-options">
                        <label><input type="checkbox" name="allergyPreference" value="Peanuts"> Peanuts</label>
                        <label><input type="checkbox" name="allergyPreference" value="Tree nuts"> Tree nuts</label>
                        <label><input type="checkbox" name="allergyPreference" value="Milk"> Milk</label>
                        <label><input type="checkbox" name="allergyPreference" value="Eggs"> Eggs</label>
                        <label><input type="checkbox" name="allergyPreference" value="Soy"> Soy</label>
                        <label><input type="checkbox" name="allergyPreference" value="Wheat"> Wheat</label>
                        <label><input type="checkbox" name="allergyPreference" value="Fish"> Fish</label>
                        <label><input type="checkbox" name="allergyPreference" value="Shellfish"> Shellfish</label>
                    </div>
                    <label class="field" style="margin-top:12px">Other allergies
                        <input class="input" id="otherAllergies" placeholder="Separate multiple allergies with commas" autocomplete="off">
                    </label>
                </div>

                <div class="preference-group">
                    <h2>Health considerations</h2>
                    <div class="preference-options">
                        <label><input type="checkbox" name="conditionPreference" value="Diabetes"> Diabetes</label>
                        <label><input type="checkbox" name="conditionPreference" value="High blood pressure"> High blood pressure</label>
                        <label><input type="checkbox" name="conditionPreference" value="Heart condition"> Heart condition</label>
                        <label><input type="checkbox" name="conditionPreference" value="Kidney condition"> Kidney condition</label>
                        <label><input type="checkbox" name="conditionPreference" value="Digestive condition"> Digestive condition</label>
                    </div>
                    <label class="field" style="margin-top:12px">Other health notes
                        <input class="input" id="otherConditions" placeholder="Separate multiple items with commas" autocomplete="off">
                    </label>
                </div>

                <!-- Save and reset buttons -->
                <div class="row" style="margin-top:18px">
                    <button class="btn btn-primary" id="sv">
                        Save profile
                    </button>

                    <button class="btn btn-ghost" id="rs">
                        Reset all data
                    </button>
                </div>

                <!-- Save confirmation message -->
                <p id="ok" class="muted" role="status"></p>

            </section>

        </main>
    </div>

    <!-- JavaScript files -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Profile page JavaScript -->
    <script>
        const $ = id => document.getElementById(id);
        const checkedValues = name => [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input => input.value);
        const setCheckedValues = (name, values) => {
            const selected = new Set(values.map(value => value.toLowerCase()));
            document.querySelectorAll(`input[name="${name}"]`).forEach(input => { input.checked = selected.has(input.value.toLowerCase()); });
        };
        const splitExtra = value => value.split(",").map(item => item.trim()).filter(Boolean);
        const api = async (path, method = "GET", payload) => {
            try {
                const response = await fetch(path, {
                    method,
                    credentials: "same-origin",
                    headers: payload === undefined ? {} : { "Content-Type": "application/json" },
                    body: payload === undefined ? undefined : JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if (response.status === 401) location.replace("login.html");
                return { ok: response.ok, data };
            } catch {
                return { ok: false, data: { error: "Cannot reach the server. Start the backend and try again." } };
            }
        };
        const showError = message => {
            $("ok").textContent = message;
            $("ok").setAttribute("role", "alert");
        };
        const optionalNumber = value => value.trim() === "" ? null : Number(value);
        async function loadProfile() {
            const [profile, dietary] = await Promise.all([
                api("/api/profile"),
                api("/api/dietary")
            ]);
            if (!profile.ok || !dietary.ok) {
                showError(profile.data.error || dietary.data.error || "Could not load your profile.");
                return;
            }
            const saved = profile.data;
            $("n").value = saved.name || "";
            $("k").value = saved.calorie_goal ?? 1800;
            $("age").value = saved.age ?? "";
            $("profileHeight").value = saved.height ?? "";
            $("profileWeight").value = saved.weight ?? "";
            setCheckedValues("dietPreference", dietary.data.diets || []);
            const allergies = dietary.data.allergies || saved.allergies || [];
            const knownAllergies = [...document.querySelectorAll('input[name="allergyPreference"]')].map(input => input.value.toLowerCase());
            setCheckedValues("allergyPreference", allergies);
            $("otherAllergies").value = allergies.filter(item => !knownAllergies.includes(item.toLowerCase())).join(", ");
            const conditions = (saved.health_notes || "").split(",").map(item => item.trim()).filter(Boolean);
            const knownConditions = [...document.querySelectorAll('input[name="conditionPreference"]')].map(input => input.value.toLowerCase());
            setCheckedValues("conditionPreference", conditions);
            $("otherConditions").value = conditions.filter(item => !knownConditions.includes(item.toLowerCase())).join(", ");
            $("sv").disabled = false;
        }

        $("sv").onclick = async () => {
            $("ok").textContent = "";
            $("ok").setAttribute("role", "status");
            const age = optionalNumber($("age").value);
            const height = optionalNumber($("profileHeight").value);
            const weight = optionalNumber($("profileWeight").value);
            const calorieGoal = optionalNumber($("k").value);
            const name = $("n").value.trim();
            const allergies = [...checkedValues("allergyPreference"), ...splitExtra($("otherAllergies").value)];
            const conditions = [...checkedValues("conditionPreference"), ...splitExtra($("otherConditions").value)];
            if (name.length < 2 || name.length > 60) {
                showError("Enter a name between 2 and 60 characters.");
                return;
            }
            if (age !== null && (!Number.isInteger(age) || age < 1 || age > 120)) {
                showError("Enter a whole-number age between 1 and 120.");
                return;
            }
            if (height !== null && (!Number.isFinite(height) || height < 100 || height > 230)) {
                showError("Enter a height between 100 and 230 cm.");
                return;
            }
            if (weight !== null && (!Number.isFinite(weight) || weight < 25 || weight > 250)) {
                showError("Enter a weight between 25 and 250 kg.");
                return;
            }
            if (!Number.isInteger(calorieGoal) || calorieGoal < 1000 || calorieGoal > 4000) {
                showError("Enter a daily calorie goal between 1000 and 4000.");
                return;
            }

            const button = $("sv");
            button.disabled = true;
            const profile = await api("/api/profile", "PUT", {
                name,
                age,
                height,
                weight,
                allergies,
                health_notes: conditions.join(", "),
                calorie_goal: calorieGoal
            });
            if (!profile.ok) {
                showError(profile.data.error || "Could not save your profile.");
                button.disabled = false;
                return;
            }
            const dietary = await api("/api/dietary", "PUT", { diets: checkedValues("dietPreference"), allergies });
            if (!dietary.ok) {
                showError(dietary.data.error || "Could not save your dietary preferences.");
                button.disabled = false;
                return;
            }
            VP.diets = dietary.data.diets;
            VP.user.name = profile.data.name;
            VP.user.goalKcal = profile.data.calorie_goal || 1800;
            VP.profile = profile.data;
            VP.dietary = dietary.data;
            window.dispatchEvent(new Event("vp-data-ready"));
            if (typeof updateShellName === "function") updateShellName(VP.user.name);
            if (typeof updateShellGoal === "function") updateShellGoal(VP.user.goalKcal);
            $("ok").textContent = "Profile saved ✓";
            button.disabled = false;
        };

        $("rs").onclick = async () => {
            if (!confirm("Delete all VitaPlate data saved to your account? Your account and login will remain.")) return;
            const button = $("rs");
            button.disabled = true;
            const result = await api("/api/account/data", "DELETE", { confirm: true });
            if (!result.ok) {
                showError(result.data.error || "Could not reset your account data.");
                button.disabled = false;
                return;
            }
            ["vp_plan","vp_shop","vp_fav","vp_rate","vp_recipe_catalog"].forEach(key=>localStorage.removeItem(key));
            $("ok").textContent = "Your account data was reset.";
            location.reload();
        };
        $("sv").disabled = true;
        loadProfile();
    </script>

</body>
</html>
