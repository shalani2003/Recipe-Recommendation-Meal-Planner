
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Profile - VitaPlate</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .profile-hero {
            background: #e8f3df;
            color: #1f5a29;
            isolation: isolate;
            overflow: hidden;
        }

        .profile-hero h1 {
            color: #1f5a29;
            position: relative;
            z-index: 2;
        }

        .profile-hero p {
            color: #426c4a;
            position: relative;
            z-index: 2;
        }

        .profile-hero .hero-photo {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 78%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.35) 24%, #000 52%);
        }

        .profile-hero > div:first-child {
            position: relative;
            z-index: 2;
            max-width: 48%;
            padding: 12px;
            border-radius: 12px;
            background: #e8f3df;
        }

        .profile-error {
            min-height: 1.2em;
            margin: 4px 0 0;
            color: var(--danger);
            font-size: .82rem;
        }

        @media (max-width: 820px) {
            .profile-hero .hero-photo {
                top: 42%;
                width: 100%;
                height: 58%;
                -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
                mask-image: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.45) 28%, #000 55%);
            }

            .profile-hero > div:first-child {
                max-width: 100%;
            }
        }
    </style>
</head>

<body data-page="profile.html" data-title="Profile">

    <!-- Main page content -->
    <div class="main">
        <main class="content">

            <!-- Section 1: Profile heading -->
            <section class="hero profile-hero">
                <div>
                    <h1>Your profile</h1>
                    <p>Set your name, daily calorie goal and diet. Everything stays in your browser.</p>
                </div>

                <img class="hero-photo" src="assets/profile.jpg" alt="Profile">
            </section>

            <!-- Section 2: Profile settings form -->
            <section class="card" style="max-width:560px;margin:0 auto">

                <!-- User name -->
                <label class="field">
                    Name
                    <input class="input" id="n" aria-describedby="nameError">
                    <p class="profile-error" id="nameError" role="alert"></p>
                </label>

                <label class="field" style="margin-top:12px">
                    Age
                    <input class="input" id="age" type="number" min="1" max="120" step="1" placeholder="Age in years" aria-describedby="ageError">
                    <p class="profile-error" id="ageError" role="alert"></p>
                </label>

                <!-- Daily calorie goal -->
                <label class="field" style="margin-top:12px">
                    Daily calorie goal (kcal)
                    <input class="input" id="k"
                              type="number" min="1000" max="4000" step="1" aria-describedby="calorieError">
                          <p class="profile-error" id="calorieError" role="alert"></p>
                </label>

                <div class="grid g-2" style="margin-top:12px">
                    <label class="field">Height (cm)
                        <input class="input" id="profileHeight" type="number" min="100" max="230" step="any" placeholder="e.g. 165" aria-describedby="heightError">
                        <p class="profile-error" id="heightError" role="alert"></p>
                    </label>
                    <label class="field">Current weight (kg)
                        <input class="input" id="profileWeight" type="number" min="25" max="250" step="any" placeholder="e.g. 60" aria-describedby="weightError">
                        <p class="profile-error" id="weightError" role="alert"></p>
                    </label>
                </div>

                <label class="field" style="margin-top:12px">Allergies (comma-separated)
                    <input class="input" id="allergies" placeholder="e.g. peanuts, eggs">
                </label>
                <label class="field" style="margin-top:12px">Infections / health notes
                    <input class="input" id="infections" placeholder="Enter any relevant notes, or leave blank">
                </label>

                <!-- Dietary restrictions -->
                <p class="muted" style="margin:14px 0 8px">
                    Dietary restrictions
                </p>

                <div class="diet" id="dt"
                     style="display:flex;gap:8px;flex-wrap:wrap">
                </div>

                <!-- Save and reset buttons -->
                <div class="row" style="margin-top:18px">
                    <button class="btn btn-primary" id="sv">
                        Save profile
                    </button>

                    <button class="btn btn-ghost" id="rs">
                        Reset all data
                    </button>
                </div>

                <!-- Save confirmation message -->
                <p id="ok" class="muted" role="status"></p>

            </section>

        </main>
    </div>

    <!-- JavaScript files -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Profile page JavaScript -->
    <script>
        const $ = id => document.getElementById(id);

        const D = [
            "Vegetarian",
            "Vegan",
            "Gluten-free",
            "Dairy-free",
            "Nut-free",
            "Halal",
            "Low sugar"
        ];

        let dt = _l("vp_diets", []);
        const savedProfile = _l("vp_profile", {});
        const savedHealth = readHealth();

        $("n").value = VP.user.name;
        $("k").value = VP.user.goalKcal;
        $("age").value = savedProfile.age || "";
        $("allergies").value = savedProfile.allergies || "";
        $("infections").value = savedProfile.infections || "";
        $("profileHeight").value = savedHealth.h || "";
        $("profileWeight").value = savedHealth.w || "";

        const dd = () => $("dt").innerHTML = D.map(x =>
            `<button class="tab" data-d="${x}"
            aria-pressed="${dt.includes(x)}">${x}</button>`
        ).join("");

        dd();

        $("dt").onclick = e => {
            const x = e.target.dataset.d;
            if (!x) return;

            dt = dt.includes(x)
                ? dt.filter(y => y != x)
                : [...dt, x];

            dd();
        };

        const validateNumber = (inputId, errorId, label, min, max, wholeNumber = false) => {
            const value = $(inputId).value.trim();
            const number = Number(value);
            let message = "";
            if (!value) message = `${label} is required.`;
            else if (!Number.isFinite(number)) message = `Enter a valid ${label.toLowerCase()}.`;
            else if (wholeNumber && !Number.isInteger(number)) message = `${label} must be a whole number.`;
            else if (number < min || number > max) message = `${label} must be between ${min} and ${max}.`;
            $(errorId).textContent = message;
            return message ? null : number;
        };

        const updateShellUser = user => {
            VP.user.name = user.name;
            VP.user.goalKcal = user.goalKcal;
            updateShellName(user.name);
            updateShellAvatar();
        };

        $("sv").onclick = () => {
            const name = $("n").value.trim();
            $("nameError").textContent = name.length >= 2 ? "" : "Enter a name with at least 2 characters.";
            const age = validateNumber("age", "ageError", "Age", 1, 120, true);
            const calorieGoal = validateNumber("k", "calorieError", "Daily calorie goal", 1000, 4000, true);
            const height = validateNumber("profileHeight", "heightError", "Height", HEALTH_LIMITS.height.min, HEALTH_LIMITS.height.max);
            const weight = validateNumber("profileWeight", "weightError", "Weight", HEALTH_LIMITS.weight.min, HEALTH_LIMITS.weight.max);
            if (!name || name.length < 2 || age === null || calorieGoal === null || height === null || weight === null) {
                $("ok").textContent = "Correct the highlighted fields before saving.";
                return;
            }

            const user = {...VP.user,name,goalKcal:calorieGoal};
            _s("vp_user", user);
            const session = _l("vp_session", null);
            const accounts = _l("vp_users", []);
            const account = session && accounts.find(item => item.email === session.email);
            if (account) {
                account.name = name;
                _s("vp_users", accounts);
            }
            _s("vp_profile", {
                age,
                allergies: $("allergies").value.trim(),
                infections: $("infections").value.trim()
            });
            saveHealth({h:height,w:weight});
            _s("vp_diets", dt);
            updateShellUser(user);
            $("ok").textContent = "Profile saved ✓";
        };

        $("rs").onclick = () => {
            if (confirm("Delete VitaPlate data saved in this browser? Other websites' data will not be changed.")) {
                resetUserData();
                location.reload();
            }
        };
    </script>

</body>
</html>
