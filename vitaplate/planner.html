
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meal Planner - VitaPlate</title>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        .hero h1,
        .hero p,
        .hero #clr {
            color: #000;
        }

        /* Meal Planner hero section */
        .hero {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            min-height: 260px;
            display: flex;
            align-items: center;
            border-radius: 18px;
        }

        .hero > div:first-child {
            position: relative;
            z-index: 2;
            max-width: 60%;
        }

        /* Healthy food background image */
        .meal-hero-image {
            position: absolute;
            inset: 0 0 0 auto;
            width: 48%;
            height: 100%;
            background-image:
                linear-gradient(
                    90deg,
                    rgba(245, 250, 241, 0.05),
                    rgba(245, 250, 241, 0) 40%
                ),
                url("images/healthy-meal.jpg");
            background-size: cover;
            background-position: center;
            border-radius: 0 18px 18px 0;
            z-index: 1;
        }

        /* Keep hero text readable */
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(245, 250, 241, 0.98) 0%,
                rgba(245, 250, 241, 0.90) 42%,
                rgba(245, 250, 241, 0.15) 100%
            );
            z-index: 0;
            pointer-events: none;
        }

        .hero > div:first-child {
            z-index: 2;
        }

        @media (max-width: 700px) {
            .hero {
                min-height: 240px;
            }

            .hero > div:first-child {
                max-width: 100%;
            }

            .meal-hero-image {
                width: 100%;
                opacity: 0.3;
                border-radius: 18px;
            }

            .hero::after {
                background: rgba(245, 250, 241, 0.72);
            }
        }
    </style>
</head>

<body data-page="planner.html" data-title="Meal planner">

<div class="main">
    <main class="content">

        <!-- Meal Planner Hero -->
        <section class="hero">

            <div>
                <h1>Your week on a plate</h1>

                <p>
                    Pick meals or auto-generate a week that fits your diet.
                    Nutrition totals update live.
                </p>

                <button class="btn btn-lime" id="auto">
                    Auto-generate week
                </button>

                <button class="btn btn-ghost" id="clr"
                        style="color:#000;background:#fff;border-color:#ffffff66">
                    Clear
                </button>
            </div>

            <!-- Healthy food photo replaces the 3 cartoon images -->
            <div class="meal-hero-image"
                 role="img"
                 aria-label="Fresh healthy food, salad and vegetables">
            </div>

        </section>

        <!-- Weekly Nutrition Totals -->
        <section class="card" style="margin-bottom:20px">

            <div class="card-head">
                <h2>Week totals</h2>
                <span class="muted" id="wk"></span>
            </div>

            <div class="grid g-3" id="tot"></div>

        </section>

        <p id="dietEmpty" class="muted" role="status" hidden></p>

        <!-- Days and Meal Selection -->
        <div class="days" id="days"></div>

    </main>
</div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>

<script>
    const $ = id => document.getElementById(id);

    // Meal plan and the recipe catalog are loaded from the backend.
    let plan = {};
    let recipeCatalog = _l("vp_recipe_catalog", []);
    const get = () => plan;
    const recipes = () => [...R, ...recipeCatalog];
    let goal = VP.user.goalKcal;
    const planRequest = async (path, method = "GET", data) => {
        const response = await fetch(path, {
            method,
            credentials: "same-origin",
            headers: data === undefined ? {} : {"Content-Type": "application/json"},
            body: data === undefined ? undefined : JSON.stringify(data)
        });
        const result = await response.json().catch(() => ({}));
        if (response.status === 401) {
            location.replace("login.html");
            throw new Error("Please sign in again.");
        }
        if (!response.ok) throw new Error(result.error || "Could not save your meal plan.");
        return result;
    };
    const planPayload = value => Object.entries(value).flatMap(([day, meals]) =>
        Object.entries(meals || {}).filter(([, id]) => id).map(([meal, id]) => {
            const recipe = recipes().find(item => String(item.id) === String(id));
            return recipe ? {
                day,
                meal,
                recipe: {name: recipe.name, ingredients: recipe.ing || recipe.ingredients || []}
            } : null;
        }).filter(Boolean)
    );
    async function savePlan(value) {
        try {
            await planRequest("/api/meal-plan", "PUT", {meals: planPayload(value)});
            return true;
        } catch (error) {
            alert(error.message);
            return false;
        }
    }
    async function loadPlan() {
        renderState($("days"), "loading", "Loading your meal plan");
        try {
            await VP.ready;
            const [catalogResult, planResult] = await Promise.all([
                planRequest("/api/recipes"),
                planRequest("/api/meal-plan")
            ]);
            const serverRecipes = Array.isArray(catalogResult) ? catalogResult : catalogResult.recipes || [];
            recipeCatalog = [
                ..._l("vp_recipe_catalog", []),
                ...serverRecipes.map(recipe => ({
                    ...recipe,
                    id: `api:${recipe.id}`,
                    ing: recipe.ingredients || [],
                    kcal: recipe.kcal || 0,
                    p: recipe.protein || recipe.p || 0,
                    c: recipe.carbs || recipe.c || 0,
                    f: recipe.fat || recipe.f || 0,
                    time: recipe.time_min || recipe.time || 0,
                    diets: recipe.diets || []
                }))
            ].filter((recipe, index, list) =>
                list.findIndex(item => String(item.id) === String(recipe.id)) === index
            );
            plan = {};
            (planResult.meals || []).forEach(item => {
                const recipe = recipes().find(candidate =>
                    candidate.name.toLowerCase() === item.recipe_name.toLowerCase()
                );
                if (!recipe) return;
                plan[item.day] = plan[item.day] || {};
                plan[item.day][item.meal] = recipe.id;
            });
            goal = VP.user.goalKcal;
            draw();
        } catch (error) {
            renderState($("days"), "error", error.message || "Could not load your meal plan.", loadPlan);
        }
    }
    // Draw the weekly meal planner
    function draw() {
        const p = get();
        const allowed = recipes().filter(dietOk);
        $("dietEmpty").textContent = "No recipes match your diet filters. Update your diet in Profile or Settings.";
        $("dietEmpty").hidden = allowed.length > 0;
        $("auto").disabled = allowed.length === 0;

        let T = {
            kcal: 0,
            p: 0,
            c: 0,
            f: 0
        };

        $("days").innerHTML = DAYS.map(d => {
            let k = 0;

            const sel = MEALS.map(m => {
                const id = (p[d] || {})[m];
                const r = recipes().find(x => String(x.id) === String(id));

                if (r) {
                    k += r.kcal;
                    T.kcal += r.kcal;
                    T.p += r.p;
                    T.c += r.c;
                    T.f += r.f;
                }

                return `
                    <label class="muted" style="font-size:.8rem">
                        ${m}

                        <select data-d="${d}" data-m="${m}">
                            <option value="">Choose…</option>

                            ${allowed.map(x => `
                                <option value="${x.id}"
                                    ${x.id == id ? "selected" : ""}>
                                    ${x.name}
                                </option>
                            `).join("")}

                        </select>
                    </label>
                `;
            }).join("");

            return `
                <article class="day">

                    <h3>
                        ${d}
                        <span class="chip ${k > goal ? "warn" : ""}">
                            ${k} kcal
                        </span>
                    </h3>

                    ${sel}

                    <div class="bar">
                        <i style="--v:${Math.min(k / goal * 100, 100)}%"></i>
                    </div>

                </article>
            `;
        }).join("");

        // Weekly calorie summary
        const w = goal * 7;

        $("wk").textContent = T.kcal + " of " + w + " kcal";

        // Nutrition summary cards
        $("tot").innerHTML = [
            ["Calories", T.kcal, w, "var(--olive)", "kcal"],
            ["Protein", T.p, 90 * 7, "var(--sage)", "g"],
            ["Carbs", T.c, 210 * 7, "var(--slate)", "g"]
        ].map(([n, v, g, c, u]) => `
            <div class="stat-row">

                <div>
                    <span>${n}</span>
                    <span class="muted">${v} / ${g} ${u}</span>
                </div>

                <div class="bar">
                    <i style="--v:${Math.min(v / g * 100, 100)}%;--c:${c}"></i>
                </div>

            </div>
        `).join("") + `
            <div class="muted">Fat ${T.f} g this week</div>
        `;
    }

    // Save selected meals
    document.addEventListener("change", async e => {
        const d = e.target.dataset;

        if (!d.d) return;

        plan[d.d] = plan[d.d] || {};
        plan[d.d][d.m] = e.target.value || 0;
        if (await savePlan(plan)) draw();
    });

    // Automatically generate meals for the week
    $("auto").onclick = async () => {
        const L = recipes().filter(dietOk);

        if (!L.length) {
            return alert("No recipes match your diet filters.");
        }

        const p = {};
        DAYS.forEach(day => {
            p[day] = {};
            MEALS.forEach(meal => {
                const available = L.filter(recipe => !Object.values(p[day]).includes(recipe.id));
                const choices = available.length ? available : L;
                p[day][meal] = choices[Math.floor(Math.random() * choices.length)].id;
            });
        });

        if (await savePlan(p)) {
            plan = p;
            draw();
        }
    };
    // Clear the weekly meal plan
    $("clr").onclick = async () => {
        try {
            await planRequest("/api/meal-plan", "DELETE");
            plan = {};
            draw();
        } catch (error) {
            alert(error.message);
        }
    };

    loadPlan();
</script>

</body>
</html>
