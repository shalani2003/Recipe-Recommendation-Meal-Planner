    code: "pm.test(\"Status code is 201 or 200\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([201, 200]);\r

      });"
    language: text/javascript
examples: .resources/Add Pantry Item.resources/examples
order: 1000
