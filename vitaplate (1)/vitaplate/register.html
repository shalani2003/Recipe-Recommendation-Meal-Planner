<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - VitaPlate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth">
<aside class="auth-art"><img src="assets/logo.jpeg" alt="VitaPlate logo"><h1>Nourish. Plan. Thrive.</h1><p>Create your free account and start planning meals from what you already have at home.</p><div class="cast" id="cast"></div></aside>
<main class="auth-form"><div class="auth-card"><h2 style="font-size:1.7rem">Create account</h2><p class="sub">It takes less than a minute.</p><div class="alert" id="alert" role="alert"></div>
<form id="regForm" novalidate style="display:flex;flex-direction:column;gap:12px">
<label class="field">Full name<input class="input" id="name" autocomplete="name"><div class="err" id="nameErr"></div></label>
<label class="field">Email<input class="input" id="email" type="email" autocomplete="email"><div class="err" id="emailErr"></div></label>
<label class="field">Password<div class="pw"><input class="input" id="pw" type="password" autocomplete="new-password"><button type="button" data-pw="pw">Show</button></div><div class="err" id="pwErr"></div></label>
<label class="field">Confirm password<div class="pw"><input class="input" id="pw2" type="password" autocomplete="new-password"><button type="button" data-pw="pw2">Show</button></div><div class="err" id="pw2Err"></div></label>
<label class="check"><input type="checkbox" id="terms"><span>I agree to the terms and privacy policy.</span></label>
<button class="btn btn-primary" type="submit">Create account</button></form>
<p class="switch">Already have an account? <a href="login.html">Log in</a></p></div></main>
<script src="js/data.js"></script><script src="js/auth.js"></script>
<script>document.getElementById("cast").innerHTML=["tomato","broccoli","avocado","egg"].map(k=>char(k,80)).join("")</script>
</body></html>
